<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Rentsiho Rental Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.58),
          rgba(0, 0, 0, 0.58)
        ),
        url(
          "https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
        );
      background-size: cover;
      background-position: center;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      padding: 50px 30px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 15px;
      font-size: clamp(38px, 7vw, 70px);
    }

    h2 {
      margin: 0 0 20px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 500;
    }

    p {
      max-width: 700px;
      margin: 0 auto 30px;
      font-size: 18px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      background: #6c3df4;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .locations {
      margin-top: 30px;
      font-size: 15px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Rentsiho</h1>

    <h2>Rental Property Management Made Simple</h2>

    <p>
      Rentsiho helps property owners and tenants manage properties,
      tenants, rent payments, reviews and rental information through
      one simple and professional platform.
    </p>

    <a
      class="button"
      href="https://newflutterkeynest-aheucafef8cnhffz.canadacentral-01.azurewebsites.net"
    >
      Open Rental Management
    </a>

    <div class="locations">
      Services for India, Switzerland and Indonesia
    </div>
  </main>
</body>
</html>
