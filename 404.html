
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0B1B29;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 100px;
            color: #D4A72C;
            margin: 0;
        }

        p {
            color: #cccccc;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #D4A72C;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The requested page does not exist.</p>
        <a href="/">Back to Home</a>
    </div>

</body>
</html>
